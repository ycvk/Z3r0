[project]
name = "z3r0"
version = "0.4.0"
description = "AI-native red-team workbench for authorized penetration testing and vulnerability research."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic==1.20.1",
    "anthropic==2.8.0",
    "asyncpg==0.31.0",
    "asyncssh==2.24.0",
    "cvss==3.6",
    "docker==7.2.0",
    "fastapi==0.139.0",
    "google-genai==2.11.0",
    "httpx==0.28.1",
    "lightrag-hku==1.5.4",
    "openai==2.45.0",
    "openai-agents==0.18.2",
    "pgvector==0.5.0",
    "pydantic==2.13.4",
    "pyjwt==2.13.0",
    "pypdf==6.14.2",
    "python-multipart==0.0.32",
    "requests==2.34.2",
    "sqlalchemy[asyncio]==2.0.51",
    "sqlmodel==0.0.39",
    "starlette==1.3.1",
    "tiktoken==0.13.0",
    "uvicorn==0.51.0",
    "websockets==16.1",
]

[dependency-groups]
dev = [
    "aiohttp==3.14.1",
    "basedpyright==1.40.2",
    "import-linter==2.16",
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false
exclude-newer = "7 days"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]
# FastAPI declares dependencies and query parameters as call defaults.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# These scripts put the repository root on sys.path before importing the app.
"scripts/export_schema.py" = ["E402"]
"scripts/update_model_catalog.py" = ["E402"]

[tool.basedpyright]
include = [
    "app.py", "config.py", "database.py", "logger.py", "main.py",
    "core", "handler", "middleware", "migrations", "model", "router", "schema", "scripts", "service", "tests", "tools",
    "utils",
]
pythonVersion = "3.13"
pythonPlatform = "Linux"
typeCheckingMode = "basic"

[tool.importlinter]
root_packages = ["router", "handler", "tools", "service", "middleware", "core", "model", "schema", "utils"]

[[tool.importlinter.contracts]]
name = "Layers import downward only"
type = "layers"
# handler serves HTTP requests and tools serves agent tool calls; neither imports the other.
layers = ["router", "handler | tools", "service", "middleware", "core", "model", "schema", "utils"]

[[tool.importlinter.contracts]]
name = "HTTP entry points read records through services"
type = "forbidden"
source_modules = ["router", "handler"]
forbidden_modules = ["model"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Credential and traffic services do not import the workflows that use them"
type = "forbidden"
source_modules = ["service.credential", "service.traffic"]
forbidden_modules = ["service.agent", "service.flow", "service.work_project"]
allow_indirect_imports = true

[tool.alembic]
script_location = "%(here)s/migrations"
prepend_sys_path = ["."]
file_template = "%%(rev)s_%%(slug)s"
